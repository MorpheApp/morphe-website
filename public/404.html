<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="error.404-title">404 - Page Not Found</title>
    <!-- Absolute paths, because this page is served for any missing URL -->
    <script src="/kit/theme-preload.js"></script>
    <script src="/js/lang-preload.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..900&display=swap">
    <link rel="stylesheet" href="/kit/kit.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--spacing-xl) var(--spacing-md);
        }

        .not-found {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-lg);
            max-width: 560px;
        }

        .not-found h1 {
            font-size: clamp(5rem, 18vw, 8rem);
            font-weight: 850;
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .not-found p {
            font-size: 1.25rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
<main class="not-found">
    <h1 class="gradient-text">404</h1>
    <p data-i18n="error.not-found">The page you're looking for can't be found</p>
    <a href="/" class="btn btn-primary" data-i18n="error.go-home">Go to Homepage</a>
</main>
<script src="/js/i18n.js"></script>
</body>
</html>
